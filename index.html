<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NullValueTelemetrySanitizer Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.6rem;
            color: var(--accent-blue);
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }

        .section-title {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-top: 20px;
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            color: #fff;
            font-family: monospace;
            font-size: 1rem;
        }

        button {
            background-color: var(--accent-blue);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #7dd3fc;
        }

        .pipeline-status {
            background-color: #090d16;
            border-left: 4px solid var(--accent-amber);
            padding: 12px 16px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .pipeline-status.complete {
            border-left-color: var(--accent-green);
        }

        .visualizer {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .metric-badge {
            padding: 8px 14px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: bold;
            background: #334155;
            color: #fff;
        }

        .metric-badge.null-val {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid var(--accent-amber);
            color: var(--accent-amber);
        }

        .metric-badge.cleaned-val {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
        }

        .console-output {
            background: #000;
            color: #22c55e;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Telemetry Data Sanitizer Control Console</h1>
    
    <div class="section-title">Ingestion Payload Input (Comma-separated)</div>
    <div class="input-group">
        <input type="text" id="payloadInput" value="45.2, None, 48.7, None, 51.3">
        <button id="runBtn" onclick="runPipeline()">Run Pipeline</button>
    </div>

    <div id="statusBox" class="pipeline-status">
        Pipeline Status: Awaiting Data Ingestion...
    </div>

    <div class="section-title">Raw Visual Payload Inspection</div>
    <div id="rawVisual" class="visualizer"></div>

    <div class="section-title" style="margin-top:25px;">Sanitized Output Pipeline</div>
    <div id="cleanVisual" class="visualizer"></div>

    <div class="section-title" style="margin-top:25px;">Expected Terminal Output Console</div>
    <div id="consoleLog" class="console-output">> Pipeline initialized.</div>
</div>

<script>
    function runPipeline() {
        const payloadInput = document.getElementById('payloadInput');
        if (!payloadInput) return;

        const rawInput = payloadInput.value;
        const rawArray = rawInput.split(',').map(item => item.trim());
        
        const rawVisual = document.getElementById('rawVisual');
        const cleanVisual = document.getElementById('cleanVisual');
        const consoleLog = document.getElementById('consoleLog');
        const statusBox = document.getElementById('statusBox');

        if (!rawVisual || !cleanVisual || !consoleLog || !statusBox) return;

        rawVisual.innerHTML = '';
        cleanVisual.innerHTML = '';

        const sanitizedArray = [];

        rawArray.forEach(item => {
            const rawBadge = document.createElement('div');
            rawBadge.className = 'metric-badge';
            
            if (item.toLowerCase() === 'none' || item === '' || item.toLowerCase() === 'null') {
                rawBadge.textContent = 'None';
                rawBadge.classList.add('null-val');
                sanitizedArray.push(0.0);
            } else {
                const num = parseFloat(item);
                const val = isNaN(num) ? 0.0 : num;
                rawBadge.textContent = val;
                sanitizedArray.push(val);
            }
            rawVisual.appendChild(rawBadge);
        });

        sanitizedArray.forEach((val, idx) => {
            const cleanBadge = document.createElement('div');
            cleanBadge.className = 'metric-badge';
            if (rawArray[idx].toLowerCase() === 'none' || rawArray[idx] === '' || rawArray[idx].toLowerCase() === 'null') {
                cleanBadge.classList.add('cleaned-val');
            }
            cleanBadge.textContent = val.toFixed(1);
            cleanVisual.appendChild(cleanBadge);
        });

        const formattedArrayStr = `[${sanitizedArray.map(v => v.toFixed(1)).join(', ')}]`;
        statusBox.className = 'pipeline-status complete';
        statusBox.textContent = 'Pipeline Status: Sanitization Pipeline Complete.';
        
        consoleLog.textContent = `SanitizationPipelineComplete. Cleaned output array timeline: ${formattedArrayStr}`;
    }

    window.onload = function() {
        runPipeline();
    };
</script>

</body>
</html>
